@import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap');

.cr{
  --bg:#0C111D; --surface:#151C2C; --line:#232D42;
  --text:#E8E4DA; --muted:#8B94A7;
  --dawn:#F2A03D; --dawn2:#E05C3A; --ok:#6FCF97; --beer:#F2C94C;
  min-height:100vh; background:var(--bg); color:var(--text);
  font-family:'Inter',system-ui,sans-serif; font-size:15px; line-height:1.5;
  max-width:480px; margin:0 auto; padding-bottom:84px;
}
.cr *{box-sizing:border-box}
.cr-load{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0C111D;color:#8B94A7;font-family:system-ui}

/* onboarding */
.onb{padding:48px 24px;display:flex;flex-direction:column;gap:16px}
.onb-eyebrow{font-size:11px;letter-spacing:.2em;color:var(--dawn)}
.onb-title{font-family:'Anton',sans-serif;font-size:88px;line-height:.9;margin:0;
  background:linear-gradient(100deg,var(--dawn2),var(--dawn));-webkit-background-clip:text;background-clip:text;color:transparent}
.onb-sub{color:var(--muted);margin:0 0 8px}
.onb-foot{font-size:12.5px;color:var(--muted);border-left:2px solid var(--dawn2);padding-left:10px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.05em}
.fld input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);font-size:16px}

/* header */
.hd{padding:20px 20px 0}
.hd-row{display:flex;justify-content:space-between;align-items:flex-start}
.hd-eyebrow{font-size:10.5px;letter-spacing:.18em;color:var(--dawn);margin-bottom:4px}
.hd-big{font-family:'Anton',sans-serif;font-size:52px;line-height:1;letter-spacing:.01em}
.hd-unit{font-size:22px;color:var(--muted)}
.hd-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.hd-trip{display:inline-block;margin-top:8px;font-size:12px;color:var(--dawn);border:1px solid rgba(242,160,61,.4);border-radius:999px;padding:4px 10px;background:rgba(242,160,61,.08)}
.hd-sun{color:var(--dawn);padding-top:6px}
.hd-bar{height:4px;background:var(--line);border-radius:2px;margin-top:14px;overflow:hidden}
.hd-fill{height:100%;background:linear-gradient(90deg,var(--dawn2),var(--dawn));border-radius:2px;transition:width .4s}

/* main + cards */
.main{padding:16px 16px 8px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.c-eyebrow{font-size:10.5px;letter-spacing:.16em;color:var(--dawn);margin-bottom:8px}
.c-title{font-family:'Anton',sans-serif;font-size:24px;letter-spacing:.02em;margin-bottom:8px}
.c-title.small{font-size:19px}
.c-note{font-size:13.5px;color:var(--text);margin:6px 0 0;opacity:.92}
.c-note.dim{color:var(--muted)}
.frase{font-size:13px;color:var(--muted);font-style:italic;margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px}

/* habits */
.hab{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;color:var(--text);font-size:14px;margin-top:8px;text-align:left;cursor:pointer}
.hab.on{border-color:var(--ok);color:var(--ok);background:rgba(111,207,151,.07)}
.hab-check{margin-left:auto}

/* beer caps \u2014 signature */
.caps{display:flex;gap:10px;margin:6px 0 12px}
.cap{width:46px;height:46px;border-radius:50%;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.cap.used{border-style:solid;border-color:var(--beer);color:var(--beer);background:rgba(242,201,76,.08);transform:rotate(-8deg)}
.cap.over{border-style:solid;border-color:var(--dawn2);color:var(--dawn2);font-weight:700;font-size:14px}
.cap-row{display:flex;align-items:center;gap:10px}
.cap-msg{font-size:12.5px;color:var(--muted);flex:1;text-align:center}
.cap-msg.bad{color:var(--dawn2)}

/* buttons */
.btn-dawn{background:linear-gradient(100deg,var(--dawn2),var(--dawn));color:#171009;border:none;border-radius:10px;
  padding:14px;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-dawn.sm{padding:10px 14px;font-size:14px}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 14px;
  font-size:13.5px;cursor:pointer;margin-top:10px;display:inline-flex;align-items:center;gap:6px}
.btn-line.sm{padding:8px 10px;margin:0}
.rst{margin-top:10px}
.reset-confirm{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.reset-confirm .btn-line.sm{align-self:flex-start}
.btn-danger{background:rgba(224,92,58,.14);border:1px solid var(--dawn2);color:var(--dawn2);border-radius:10px;
  padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer}

/* gym */
.seg{display:flex;gap:8px}
.seg-b{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:10px;
  padding:10px;font-family:'Anton',sans-serif;font-size:18px;cursor:pointer}
.seg-b.on{color:#171009;background:linear-gradient(100deg,var(--dawn2),var(--dawn));border-color:transparent}
.ex-hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ex-scheme{font-family:'Anton',sans-serif;color:var(--dawn);font-size:16px;letter-spacing:.04em;white-space:nowrap}
.set{display:flex;gap:8px;align-items:center;margin-top:8px}
.set.done{opacity:.55}
.set-n{font-size:11px;color:var(--muted);width:22px}
.set input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--text);font-size:15px}
.set-chk{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.set-chk.on{border-color:var(--ok);color:var(--ok);background:rgba(111,207,151,.1)}

/* comida */
.macro-row{display:flex;gap:8px;margin-top:4px}
.macro{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.macro b{font-family:'Anton',sans-serif;font-size:20px;display:block;color:var(--dawn)}
.macro span{font-size:11px;color:var(--muted);letter-spacing:.08em}
.meal-hd{display:flex;align-items:center;gap:8px;font-size:14.5px}
.meal-time{font-family:'Anton',sans-serif;color:var(--dawn);font-size:15px;letter-spacing:.05em}
.acc{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:none;color:var(--text);font-size:14.5px;cursor:pointer;padding:2px 0}
.supp{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:14px}

/* salud */
.ul{margin:10px 0 0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.sched{display:flex;gap:12px;padding:9px 10px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.sched.now{background:rgba(242,160,61,.09);color:var(--text);border:1px solid rgba(242,160,61,.35)}
.sched-d{font-family:'Anton',sans-serif;color:var(--dawn);width:36px;letter-spacing:.05em}

/* progreso */
.w-row{display:flex;gap:8px;margin-top:10px}
.w-row input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--text);font-size:16px}
.svg{width:100%;height:auto;margin-top:6px}
.w-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.w-item:last-child{border-bottom:none}

/* timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:var(--surface);border:1px solid var(--dawn);
  color:var(--dawn);border-radius:999px;padding:10px 18px;display:flex;align-items:center;gap:10px;z-index:20;cursor:pointer;
  font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.timer.done{border-color:var(--ok);color:var(--ok)}

/* nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;
  background:rgba(12,17,29,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10}
.nav-b{flex:1;background:transparent;border:none;color:var(--muted);padding:10px 0 12px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10.5px;cursor:pointer;letter-spacing:.03em}
.nav-b.on{color:var(--dawn)}
@media (prefers-reduced-motion: reduce){.cr *{transition:none!important}}
